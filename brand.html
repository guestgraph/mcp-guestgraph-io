<!-- The brand lockup guestgraph.io opens with, the same markup: three open records resolving
     into one solid profile, drawn in currentColor with the ring fills in the ground, and the
     wordmark's second half in the accent, so both follow the theme where an image could not.
     Copied rather than shared for the reason every surface in this family copies it — the
     design package styles .brand and ships no SVG for it. -->
<svg viewBox="0 0 32 32" aria-hidden="true">
  <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M8.6 7.2 L20.5 14.2"/><path d="M8.6 16 L19.4 16"/><path d="M8.6 24.8 L20.5 17.8"/>
    <circle cx="6" cy="7.2" r="2.6" fill="var(--ground)"/>
    <circle cx="6" cy="16" r="2.6" fill="var(--ground)"/>
    <circle cx="6" cy="24.8" r="2.6" fill="var(--ground)"/>
  </g>
  <circle cx="24" cy="16" r="5.4" fill="currentColor"/>
</svg><b>Guest<span>Graph</span></b>
